<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chuchu's Pure Oat Bite</title>
<meta name="theme-color" content="#4a2e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oat Bite">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4eadb; --bg2:#efe2cd; --card:#fffaf2; --ink:#3a2513; --muted:#8b7156; --line:#e6d6bd;
  --accent:#b25c26; --accent-d:#8f4517; --honey:#e3a246;
  --ok:#3c7a4b; --ok-bg:#e3f0e3; --bad:#b0382a; --bad-bg:#f8e1dc; --warn:#9c6a08; --warn-bg:#fbefd3; --info:#2d6884; --info-bg:#dfedf3;
  --radius:16px; --shadow:0 1px 0 rgba(74,46,23,.06),0 6px 18px -10px rgba(74,46,23,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 20% 10%,rgba(227,162,70,.10) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(139,113,86,.08) 0 2px,transparent 3px);background-size:38px 38px,53px 53px}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* header */
.top{background:linear-gradient(160deg,#5a3719,#3c2412);color:#fbefdc;padding:calc(14px + env(safe-area-inset-top)) 0 18px;border-bottom:4px solid var(--honey)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f1c27d,#c98a3a 60%,#9c6326);display:grid;place-items:center;font-size:24px;box-shadow:inset -3px -4px 0 rgba(0,0,0,.15)}
.brand h1{font-size:21px;font-weight:800;line-height:1.1}
.brand p{margin:2px 0 0;font-size:13px;opacity:.75}
.demo-banner{background:var(--warn-bg);color:var(--warn);font-size:13px;padding:8px 16px;text-align:center;border-bottom:1px solid #ecd9a8}

/* month bar */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.monthbar h2{font-size:20px}
.mbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}

main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.section-title{font-family:Fraunces,serif;font-size:17px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.section-title small{font-family:Figtree;font-size:13px;color:var(--muted);font-weight:500}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;display:block;width:100%;text-align:left}
.tap{cursor:pointer;transition:transform .08s}
.tap:active{transform:scale(.985)}
.hero{background:linear-gradient(150deg,#fffaf2,#fbeed8);padding:18px}
.hero .label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.hero .big{font-family:Fraunces,serif;font-size:38px;font-weight:800;line-height:1.05;margin:4px 0 2px}
.hero .big.loss{color:var(--bad)} .hero .big.gain{color:var(--ok)}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.trio div{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.trio span{display:block;font-size:12px;color:var(--muted)}
.trio b{font-size:15px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-d)}
.btn.soft{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #e6b9b1}
.btn.wide{width:100%}
.btn.big{padding:16px;font-size:17px}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 0}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .sub{font-size:13px;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.amt.bad{color:var(--bad)} .amt.ok{color:var(--ok)}

/* day groups (like the notebook) */
.day{margin-bottom:18px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.day-head .d{font-family:Fraunces,serif;font-weight:700;font-size:16px}
.day-head .t{font-size:13px;color:var(--muted)}
.day-head .t b{color:var(--ink);font-size:15px}
.order-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.who{font-weight:700}
.lines{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:2px 0;color:#5b4630}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.info{background:var(--info-bg);color:var(--info)}
.badge.muted{background:var(--bg2);color:var(--muted)}
.note{font-size:13px;color:var(--muted);font-style:italic;width:100%}
.by{font-size:11px;color:var(--muted);margin-top:6px;text-align:right}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg2);color:var(--muted);margin-left:6px;white-space:nowrap}

.bars .bar{margin:8px 0}
.bars .bar .row{font-size:14px}
.bars .track{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:4px}
.bars .fill{height:100%;background:linear-gradient(90deg,var(--honey),var(--accent));border-radius:99px}

table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th,table.rep td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
table.rep th:first-child,table.rep td:first-child{text-align:left}
table.rep th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
table.rep tr.tot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}

.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .e{font-size:40px;margin-bottom:6px}

.menu .card{display:flex;align-items:center;gap:14px;padding:16px}
.menu .ic{width:40px;height:40px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:20px;flex:none}
.menu .card div b{display:block}
.menu .card div span{font-size:13px;color:var(--muted)}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:14px 0 0;cursor:pointer;font-size:15px}

/* FAB + nav */
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;padding:15px 20px;box-shadow:0 10px 24px -8px rgba(143,69,23,.7);cursor:pointer;font-size:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,250,242,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button .i{font-size:21px;line-height:1;filter:grayscale(.6);opacity:.75}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on .i{filter:none;opacity:1}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50}
.sheet-backdrop{position:absolute;inset:0;background:rgba(40,24,10,.45)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:94vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h2{font-size:22px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:16px;cursor:pointer}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea,.line select,.line input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none}
.f input:focus,.f select:focus,.f textarea:focus,.line select:focus,.line input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(178,92,38,.15)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.line>*+*{margin-top:8px}
.line-nums{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:end}
.line-nums label{font-size:12px;font-weight:700;color:var(--muted)}
.line-nums label input{margin-top:3px;padding:10px}
.ln-total{font-weight:800;padding:0 4px 12px;min-width:58px;text-align:right}
.icon-btn{width:38px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;color:var(--bad)}
.ex-grid{display:grid;grid-template-columns:1fr 92px 38px;gap:8px;align-items:center}
.sum-box{display:flex;justify-content:space-between;align-items:baseline;background:#3c2412;color:#fbefdc;border-radius:14px;padding:12px 14px;margin:12px 0}
.sum-box b{font-family:Fraunces,serif;font-size:24px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg label{text-align:center;padding:10px 4px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg input{display:none}
.seg label:has(input:checked){background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.check{display:flex;align-items:center;gap:10px;font-weight:600;margin:6px 0 14px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.actions{display:grid;gap:10px;margin-top:8px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px 22px;text-align:center}
.logo-big{width:76px;height:76px;margin:0 auto 12px;font-size:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 35%,#f1c27d,#c98a3a 60%,#9c6326)}
.login-card h1{font-size:25px;font-weight:800}
.login-card form{text-align:left;margin-top:20px}
.err{color:var(--bad);font-size:14px;min-height:1em}
.loading{text-align:center;padding:60px 0;color:var(--muted)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2b1a0c;color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin"></div>Opening…</div></div>
<div id="sheet" class="sheet hidden"></div>
<div id="toast"></div>

<script type="module">
/* ================================================================
   1) PASTE YOUR FIREBASE SETTINGS HERE (see README.md).
   While these still say PASTE..., the app runs in DEMO MODE and
   saves only on the device you are using.
   ================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT.firebaseapp.com",
  projectId: "PASTE_PROJECT",
  storageBucket: "PASTE_PROJECT.appspot.com",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};
/* Optional: friendly names shown on records ("added by ...") */
const PEOPLE = { /* "you@gmail.com": "Chuckles", "partner@gmail.com": "Chuchu" */ };

const DEMO = !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith("PASTE");
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
const COLS = ["sales","expenses","money","customers","products","expenseItems","meta"];
const EXP_CATS = ["Ingredients","Packaging","Transport","Utilities","Equipment","Marketing","Miscellaneous"];
const PAID_FROM = ["Sales money (cash)","Bank account","MoMo","Borrowed money (loan)","Personal money"];
const MONEY_TYPES = {
  loan_in:  {label:"Borrowed money (loan taken)", sign:+1},
  loan_out: {label:"Loan repayment",             sign:-1},
  to_bank:  {label:"Sales money sent to bank",   sign:0},
  capital:  {label:"Money put into the business", sign:+1},
  drawing:  {label:"Money taken out by owner",   sign:-1},
  other:    {label:"Other",                      sign:0}
};
const GROUPS = ["Cookies","Pies","Extras"];

/* ---------- Starter price list (from the notebook, latest prices) ---------- */
const P = {
  reg30:"Oat cookies – Regular (30 pcs)", gin30:"Oat cookies – Ginger (30 pcs)", cin30:"Oat cookies – Cinnamon (30 pcs)",
  cho30:"Oat cookies – Choco (30 pcs)",  nut30:"Oat cookies – Nuts (30 pcs)",
  gin15:"Oat cookies – Ginger (15 pcs)", cho15:"Oat cookies – Choco (15 pcs)",
  reg7:"Oat cookies – Regular (7 pcs)", gin7:"Oat cookies – Ginger (7 pcs)", cin7:"Oat cookies – Cinnamon (7 pcs)",
  cho7:"Oat cookies – Choco (7 pcs)", nut7:"Oat cookies – Nuts (7 pcs)",
  ofish:"Oat fish pie", ochk:"Oat chicken pie", obeef:"Oat beef pie",
  rfish:"Regular fish pie", rchk:"Regular chicken pie", rbeef:"Regular beef pie",
  olive:"Extra: olive oil (per pie)"
};
const STARTER_PRODUCTS = [
  ["reg30","Cookies",90],["gin30","Cookies",90],["cin30","Cookies",90],["cho30","Cookies",110],["nut30","Cookies",115],
  ["gin15","Cookies",55],["cho15","Cookies",65],
  ["reg7","Cookies",20],["gin7","Cookies",25],["cin7","Cookies",25],["cho7","Cookies",35],["nut7","Cookies",40],
  ["rfish","Pies",20],["rchk","Pies",25],["rbeef","Pies",25],["ofish","Pies",25],["ochk","Pies",30],["obeef","Pies",30],
  ["olive","Extras",5]
].map(([k,g,price],i)=>({id:k,name:P[k],group:g,price,active:true,sort:i}));

/* ---------- Notebook records, July–August 2026 (typed from the photos) ---------- */
const L = (k,qty,price)=>({product:P[k],qty,price});
const sale = (id,date,items,o={})=>{const total=items.reduce((a,i)=>a+i.qty*i.price,0);
  return {id:"nb-s-"+id,date,items,total,paid:o.paid??total,customer:o.customer||"",deliveryDate:"",delivered:true,notes:o.notes||"",createdBy:"notebook",createdAt:0};};
/* Expense items list (built from the notebook). Edit it in the app: More → Expense items */
const EXP_ITEM_LIST = {
  Ingredients:["Oats","Flour","Margarine","Egg","Honey","Chocolate","Chocolate chips","Ginger","Ginger & garlic","Cinnamon","Nutmeg","Vanilla","Flavors",
    "Coconut","Almonds","Walnuts","Nido","Milk powder","Non-dairy milk powder","K-10 milk","Tuna","Tuna flakes","Canned fish","Chicken","Beef",
    "Onion","Green pepper","Onga & kivo pepper","Carrot","Vegetables","Curry powder"],
  Packaging:["Label stickers","Label printout","Containers","Pack (cookies)","Pack for pie","Seal rubber","Tissue paper","Heat gun"],
  Transport:["Transport","Lorry fare","Delivery fee"],
  Utilities:["Gas"],
  Equipment:["Baking sheet","Hand mixer"],
  Marketing:[], Miscellaneous:[]
};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const STARTER_EXP_ITEMS=Object.entries(EXP_ITEM_LIST).flatMap(([category,names])=>names.map((name,i)=>({id:"xi-"+slug(name),name,category,active:true,sort:i})));
const CAT_OF=Object.fromEntries(STARTER_EXP_ITEMS.map(x=>[x.name,x.category]));
const exp = (id,date,lines,o={})=>({id:"nb-e-"+id,date,items:lines.map(([item,amount,details=""])=>({item,category:CAT_OF[item]||"Miscellaneous",amount,details})),
  total:lines.reduce((a,l)=>a+l[1],0),paidFrom:o.from||"",notes:o.notes||"",createdBy:"notebook",createdAt:0});
const NOTEBOOK = {
  sales:[
    sale("20260720","2026-07-20",[L("reg30",3,75),L("ofish",2,25)],{notes:"Delivery Thu/Fri – delivered"}),
    sale("20260721","2026-07-21",[L("gin30",1,75),L("cho30",1,85),L("nut30",1,90)],{notes:"Delivery Thu/Fri – delivered. Balance paid."}),
    sale("20260728","2026-07-28",[L("reg7",1,20),L("gin7",1,25),L("cin7",1,25),L("cho7",1,35),L("nut7",1,40),L("ofish",1,25),L("ochk",1,30),L("obeef",1,30),L("olive",8,5),L("rfish",2,20),L("rbeef",3,25)],{customer:"Wizzy",notes:"Delivery Friday. Remaining balance of 70 paid."}),
    sale("20260804","2026-08-04",[L("cho30",2,90),L("gin30",1,80),L("rchk",6,25)],{notes:"Client order. 10gh change kept on this day. + Rita's pie."}),
    sale("20260808","2026-08-08",[L("gin30",1,80),L("cho30",1,90),L("rbeef",2,25),L("rchk",2,25)],{notes:"Delivered on the 13th"}),
    sale("20260809","2026-08-09",[L("rfish",2,20),L("rchk",2,25),L("rbeef",1,25)],{paid:50,notes:"Delivery on 13th. Notebook says paid only 50gh – update if the balance was paid."}),
    sale("20260811","2026-08-11",[L("nut30",2,95)]),
    sale("20260820","2026-08-20",[L("gin15",1,55),L("cho15",1,65)],{notes:"Money used to buy items"}),
    sale("20260821","2026-08-21",[L("nut30",1,115),L("cho30",1,110),L("rfish",2,20),L("rchk",2,25),L("rbeef",1,25)],{notes:"Discounted"}),
    sale("20260824","2026-08-24",[L("reg30",4,75),L("ofish",2,25)]),
    sale("20260825","2026-08-25",[L("cho30",2,110),L("rchk",6,25)],{paid:0,notes:"Not paid yet (notebook). Delivery on Monday."}),
    sale("20260826","2026-08-26",[L("cho30",1,110),L("gin30",1,90)]),
    sale("20260828","2026-08-28",[L("nut30",2,115),L("reg30",1,90),L("cho30",1,100)],{paid:330,notes:"Regular cookies (90) marked 'not paid' in notebook."}),
    sale("20260830","2026-08-30",[L("rfish",2,20),L("rchk",1,25),L("rbeef",2,25)],{notes:"Gave Lawrencia 2 pies, Chris 1 pie"})
  ],
  expenses:[
    exp("20260720","2026-07-20",[["Margarine",300],["Egg",10],["Flour",37],["Tuna",45],["Onion",10,"& green pepper"],["Coconut",15]],{notes:"Made pie for Wizzy's friend"}),
    exp("20260721","2026-07-21",[["Baking sheet",35],["Tissue paper",7]]),
    exp("20260723","2026-07-23",[["Oats",54,"3"],["Egg",10],["Green pepper",5],["Nido",8],["Ginger",10],["Honey",40],["Non-dairy milk powder",16],["Chocolate",15]],{notes:"Some used for the Tuesday orders"}),

/* ---------- helpers ---------- */
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:0;};
const money=v=>"GH₵ "+num(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const short=v=>"₵"+num(v).toLocaleString("en-US",{maximumFractionDigits:2});
const sum=(arr,f)=>arr.reduce((a,x)=>a+num(f(x)),0);
const saleTotal=s=>(s.items||[]).reduce((a,i)=>a+num(i.qty)*num(i.price),0);
const expTotal=e=>(e.items||[]).reduce((a,i)=>a+num(i.amount),0);
const saleOwed=s=>Math.max(0,Math.round((saleTotal(s)-num(s.paid))*100)/100);
const dateDesc=(a,b)=>(b.date||"").localeCompare(a.date||"")||num(b.createdAt)-num(a.createdAt);
function parseD(iso){const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d);}
const fmtDate=iso=>iso?parseD(iso).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}):"";
const fmtShort=iso=>iso?parseD(iso).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}):"";
const fmtMonth=ym=>{const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});};
const shiftMonth=(ym,n)=>{const [y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};
function groupBy(arr,fn){const m=new Map();for(const x of arr){const k=fn(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x);}return m;}
const clean=o=>JSON.parse(JSON.stringify(o));
const nameOf=e=>!e?"":e==="notebook"?"notebook":PEOPLE[e]||String(e).split("@")[0];
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2400);}
const fail=err=>{console.error(err);toast("Could not save: "+(err?.code||err?.message||"error"));};

/* ---------- state ---------- */
const S={user:null,tab:"home",more:null,month:today().slice(0,7),data:{sales:[],expenses:[],money:[],customers:[],products:[],expenseItems:[],meta:[]},loaded:new Set(),server:new Set(),seed:{}};
let store=null, sheet=null;

/* ---------- storage: demo (this device only) ---------- */
function localStore(){
  const key=c=>"chuchu-oatbite-demo-"+c, subs={};
  const read=c=>{try{return JSON.parse(localStorage.getItem(key(c))||"[]");}catch{return [];}};
  const write=(c,a)=>{try{localStorage.setItem(key(c),JSON.stringify(a));}catch{} (subs[c]||[]).forEach(f=>f(a));};
  const id=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
  return {
    watch(c,cb){const f=a=>cb(a,false);(subs[c]=subs[c]||[]).push(f);f(read(c));},
    async add(c,o){write(c,[...read(c),{...clean(o),id:id(),createdBy:"demo",createdAt:Date.now()}]);},
    async update(c,i,o){write(c,read(c).map(x=>x.id===i?{...x,...clean(o),updatedBy:"demo",updatedAt:Date.now()}:x));},
    async remove(c,i){write(c,read(c).filter(x=>x.id!==i));},
    async setMany(c,list){const ids=new Set(list.map(x=>x.id));write(c,read(c).filter(x=>!ids.has(x.id)).concat(clean(list)));},
    async clearAll(){COLS.forEach(c=>write(c,[]));}
  };
}

/* ---------- storage: Firebase (shared between both of you) ---------- */
async function firebaseStore(){
  const [appM,authM,fs]=await Promise.all([import(FB+"firebase-app.js"),import(FB+"firebase-auth.js"),import(FB+"firebase-firestore.js")]);
  const app=appM.initializeApp(FIREBASE_CONFIG);
  const auth=authM.getAuth(app);
  let db;
  try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});}
  catch(e){db=fs.getFirestore(app);}
  const who=()=>auth.currentUser?.email||"";
  let unsubs=[];
  return {
    auth,authM,
    watch(c,cb){unsubs.push(fs.onSnapshot(fs.collection(db,c),{includeMetadataChanges:true},snap=>cb(snap.docs.map(d=>({...d.data(),id:d.id})),snap.metadata.fromCache),err=>{console.error(err);toast(err.code==="permission-denied"?"This account is not allowed to see the records":"Sync problem: "+err.code);}));},
    stopAll(){unsubs.forEach(u=>u());unsubs=[];},
    add:(c,o)=>fs.addDoc(fs.collection(db,c),clean({...o,createdBy:who(),createdAt:Date.now()})),
    update:(c,i,o)=>fs.updateDoc(fs.doc(db,c,i),clean({...o,updatedBy:who(),updatedAt:Date.now()})),
    remove:(c,i)=>fs.deleteDoc(fs.doc(db,c,i)),
    async setMany(c,list){for(let k=0;k<list.length;k+=400){const b=fs.writeBatch(db);list.slice(k,k+400).forEach(({id,...rest})=>b.set(fs.doc(db,c,id),clean(rest)));await b.commit();}}
  };
}

/* ---------- boot ---------- */
async function boot(){
  if(DEMO){store=localStore();S.user={email:"demo"};watchAll();return;}
  try{store=await firebaseStore();}
  catch(e){console.error(e);document.getElementById("app").innerHTML=`<div class="login"><div class="login-card"><div class="logo-big">🍪</div><h1>Can't connect</h1><p class="muted">Check your internet connection and reload. If this keeps happening, check the Firebase settings at the top of index.html.</p></div></div>`;return;}
  store.authM.onAuthStateChanged(store.auth,u=>{
    if(u){S.user=u;watchAll();}
    else{store.stopAll();S.user=null;S.loaded.clear();COLS.forEach(c=>S.data[c]=[]);render();}
  });
}
function watchAll(){
  COLS.forEach(c=>store.watch(c,(arr,fromCache)=>{
    S.data[c]=arr;S.loaded.add(c);if(!fromCache)S.server.add(c);
    autoSeed();render();
  }));
  render();
}
/* First time only (checked against the server, never an empty phone cache):
   load the price list, the expense items list and the notebook records. */
function autoSeed(){
  const ok=c=>S.server.has(c);
  if(ok("products")&&!S.data.products.length&&!S.seed.p){S.seed.p=1;store.setMany("products",STARTER_PRODUCTS).catch(fail);}
  if(ok("expenseItems")&&!S.data.expenseItems.length&&!S.seed.x){S.seed.x=1;store.setMany("expenseItems",STARTER_EXP_ITEMS).catch(fail);}
  if(ok("meta")&&ok("sales")&&ok("customers")&&!S.seed.nb&&!S.data.meta.some(m=>m.id==="notebook")){
    S.seed.nb=1;
    if(!S.data.sales.some(s=>String(s.id).startsWith("nb-s-")))loadNotebook();
    store.setMany("meta",[{id:"notebook",loadedAt:Date.now()}]).catch(fail);
  }
}
function loadNotebook(){
  const known=new Set(S.data.customers.map(c=>(c.name||"").trim().toLowerCase()));
  const custs=NOTEBOOK.customers.filter(c=>!known.has(c.name.toLowerCase())||S.data.customers.some(x=>x.id===c.id));
  return Promise.all([store.setMany("sales",NOTEBOOK.sales),store.setMany("expenses",NOTEBOOK.expenses),store.setMany("money",NOTEBOOK.money),store.setMany("customers",custs)]).catch(fail);
}

/* ---------- derived ---------- */
const monthSales=ym=>S.data.sales.filter(s=>(s.date||"").startsWith(ym));
const monthExp=ym=>S.data.expenses.filter(e=>(e.date||"").startsWith(ym));
const CAT_ORDER=c=>{const i=EXP_CATS.indexOf(c);return i<0?99:i;};
const sortItems=(a,b)=>(CAT_ORDER(a.category)-CAT_ORDER(b.category))||(num(a.sort)-num(b.sort))||a.name.localeCompare(b.name);
const activeExpItems=()=>S.data.expenseItems.filter(x=>x.active!==false).sort(sortItems);
const activeProducts=()=>S.data.products.filter(p=>p.active!==false).sort((a,b)=>(GROUPS.indexOf(a.group)-GROUPS.indexOf(b.group))||(num(a.sort)-num(b.sort))||a.name.localeCompare(b.name));
function loanBalance(){return sum(S.data.money.filter(m=>m.type==="loan_in"),m=>m.amount)-sum(S.data.money.filter(m=>m.type==="loan_out"),m=>m.amount);}
function customerNames(){const s=new Map();S.data.customers.forEach(c=>c.name&&s.set(c.name.trim().toLowerCase(),c.name.trim()));S.data.sales.forEach(x=>x.customer&&!s.has(x.customer.trim().toLowerCase())&&s.set(x.customer.trim().toLowerCase(),x.customer.trim()));return [...s.values()].sort();}
function custStats(name){const n=name.trim().toLowerCase();const ss=S.data.sales.filter(s=>(s.customer||"").trim().toLowerCase()===n);return{count:ss.length,total:sum(ss,saleTotal),owed:sum(ss,saleOwed),last:ss.map(s=>s.date).sort().pop()||""};}

function syncSale(){
  const st=sheet;if(!st||st.kind!=="sale")return;
  st.date=val("s-date");st.customer=val("s-cust");st.deliveryDate=val("s-del");st.delivered=!!document.getElementById("s-done")?.checked;st.notes=val("s-notes");
  if(document.getElementById("s-paid"))st.paidAmt=val("s-paid");
  document.querySelectorAll(".ln-qty").forEach(el=>st.items[el.dataset.i].qty=el.value);
  document.querySelectorAll(".ln-price").forEach(el=>st.items[el.dataset.i].price=el.value);
  document.querySelectorAll(".ln-name").forEach(el=>st.items[el.dataset.i].product=el.value);
}
function refreshSaleTotals(){
  const st=sheet,total=st.items.reduce((a,i)=>a+num(i.qty)*num(i.price),0);
  st.items.forEach((it,i)=>{const e=document.getElementById("lt-"+i);if(e)e.textContent=short(num(it.qty)*num(it.price));});
  document.getElementById("s-total").textContent=money(total);
  const o=document.getElementById("s-owed");if(o)o.textContent=money(Math.max(0,total-num(st.paidAmt)));
}
function saveSale(){
  syncSale();const st=sheet;
  const items=st.items.filter(i=>String(i.product).trim()&&num(i.qty)>0).map(i=>({product:String(i.product).trim(),qty:num(i.qty),price:num(i.price)}));
  if(!st.date)return toast("Please choose a date");
  if(!items.length)return toast("Add at least one product with a quantity");
  const total=items.reduce((a,i)=>a+i.qty*i.price,0);
  const paid=st.payMode==="full"?total:st.payMode==="none"?0:Math.min(num(st.paidAmt),total);
  const rec={date:st.date,customer:st.customer.trim(),items,total,paid,deliveryDate:st.deliveryDate,delivered:st.delivered,notes:st.notes.trim()};
  (st.id?store.update("sales",st.id,rec):store.add("sales",rec)).catch(fail);
  const cn=rec.customer.toLowerCase();
  if(cn&&!S.data.customers.some(c=>(c.name||"").trim().toLowerCase()===cn))store.add("customers",{name:rec.customer,phone:"",notes:""}).catch(fail);
  closeSheet();toast(st.id?"Sale updated":"Sale saved ✓");
}

  if(!st.date)return toast("Please choose a date");
  if(!items.length)return toast("Choose at least one item and enter the amount");
  const rec={date:st.date,paidFrom:st.paidFrom,notes:st.notes.trim(),items,total:items.reduce((a,i)=>a+i.amount,0)};

function openXItem(x){
  sheet={kind:"xitem",id:x?.id,oldName:x?.name||""};
  openSheet(`${head(x?"Edit item":"New expense item")}
  <label class="f"><span>Item name</span><input id="x-name" placeholder="e.g. Butter" value="${esc(x?.name||"")}"></label>
  <label class="f"><span>Category</span><select id="x-cat">${EXP_CATS.map(c=>`<option ${(x?.category||"Ingredients")===c?"selected":""}>${c}</option>`).join("")}</select></label>
  <label class="check"><input id="x-active" type="checkbox" ${x?.active===false?"":"checked"}> Show in the dropdown</label>
  <p class="muted" style="font-size:13px;margin:0 0 12px">Renaming here doesn't change expenses already recorded.</p>
  <div class="actions"><button class="btn primary big wide" data-action="save-xitem">Save</button></div>`);
}
function saveXItem(){
  const rec={name:val("x-name").trim(),category:val("x-cat"),active:document.getElementById("x-active").checked};
  if(!rec.name)return toast("Please add a name");
  const dupe=S.data.expenseItems.find(x=>x.name.trim().toLowerCase()===rec.name.toLowerCase()&&x.id!==sheet.id);
  if(dupe)return toast("That item is already on the list");
  if(!sheet.id)rec.sort=1000;
  (sheet.id?store.update("expenseItems",sheet.id,rec):store.add("expenseItems",rec)).catch(fail);
  closeSheet();toast("Expense items updated ✓");
}

/* ---- money ---- */
function openMoney(m){
  sheet={kind:"money",id:m?.id};
  openSheet(`${head(m?"Edit entry":"Loan / money entry")}
  <label class="f"><span>Date</span><input id="m-date" type="date" value="${esc(m?.date||today())}"></label>
  <label class="f"><span>Type</span><select id="m-type">${Object.entries(MONEY_TYPES).map(([k,v])=>`<option value="${k}" ${m?.type===k?"selected":""}>${v.label}</option>`).join("")}</select></label>
  <label class="f"><span>Amount ₵</span><input id="m-amt" type="number" inputmode="decimal" min="0" step="any" value="${esc(m?.amount??"")}"></label>
  <label class="f"><span>Notes</span><textarea id="m-notes" rows="2" placeholder="e.g. borrowed on MoMo">${esc(m?.notes||"")}</textarea></label>
  <div class="actions"><button class="btn primary big wide" data-action="save-money">Save</button>${m?`<button class="btn danger wide" data-action="del-money">Delete</button>`:""}</div>`);
}
function saveMoney(){
  const rec={date:val("m-date"),type:val("m-type"),amount:num(val("m-amt")),notes:val("m-notes").trim()};
  if(!rec.date||rec.amount<=0)return toast("Add a date and an amount");
  (sheet.id?store.update("money",sheet.id,rec):store.add("money",rec)).catch(fail);
  closeSheet();toast("Saved ✓");
}

/* ---- customer ---- */
function openCust(name){
  const c=name?S.data.customers.find(x=>(x.name||"").trim().toLowerCase()===name.toLowerCase()):null;
  sheet={kind:"cust",id:c?.id,oldName:name||""};
  const hist=name?S.data.sales.filter(s=>(s.customer||"").trim().toLowerCase()===name.toLowerCase()).sort(dateDesc):[];
  openSheet(`${head(name?esc(name):"New customer")}
  <label class="f"><span>Name</span><input id="c-name" value="${esc(c?.name||name||"")}"></label>
  <label class="f"><span>Phone</span><input id="c-phone" type="tel" inputmode="tel" value="${esc(c?.phone||"")}"></label>
  <label class="f"><span>Notes</span><textarea id="c-notes" rows="2" placeholder="e.g. likes choco, delivers to East Legon">${esc(c?.notes||"")}</textarea></label>
  <div class="actions"><button class="btn primary big wide" data-action="save-cust">Save</button>${c?`<button class="btn danger wide" data-action="del-cust">Remove from customer list</button>`:""}</div>
  ${hist.length?`<div class="section-title">Orders</div><div class="card">${hist.map(s=>`<div class="list-item"><div><b>${fmtDate(s.date)}</b><div class="sub">${(s.items||[]).map(i=>num(i.qty)+"× "+esc(i.product)).join(", ")}</div></div><div style="text-align:right"><div class="amt">${short(saleTotal(s))}</div>${saleOwed(s)>0?`<div class="sub" style="color:var(--bad)">owes ${short(saleOwed(s))}</div>`:""}</div></div>`).join("")}</div>`:""}`);
}
function saveCust(){
  const rec={name:val("c-name").trim(),phone:val("c-phone").trim(),notes:val("c-notes").trim()};
  if(!rec.name)return toast("Please add a name");
  (sheet.id?store.update("customers",sheet.id,rec):store.add("customers",rec)).catch(fail);
  if(sheet.oldName&&sheet.oldName!==rec.name)S.data.sales.filter(s=>(s.customer||"").trim().toLowerCase()===sheet.oldName.toLowerCase()).forEach(s=>store.update("sales",s.id,{customer:rec.name}).catch(fail));
  closeSheet();toast("Customer saved ✓");
}

/* ---- product ---- */
function openProd(p){
  sheet={kind:"prod",id:p?.id};
  openSheet(`${head(p?"Edit product":"New product")}
  <label class="f"><span>Name</span><input id="p-name" placeholder="e.g. Oat cookies – Coconut (30 pcs)" value="${esc(p?.name||"")}"></label>
  <div class="two"><label class="f"><span>Group</span><select id="p-group">${GROUPS.map(g=>`<option ${(p?.group||"Cookies")===g?"selected":""}>${g}</option>`).join("")}</select></label>
  <label class="f"><span>Usual price ₵</span><input id="p-price" type="number" inputmode="decimal" min="0" step="any" value="${esc(p?.price??"")}"></label></div>
  <label class="check"><input id="p-active" type="checkbox" ${p?.active===false?"":"checked"}> Show on the sale form</label>
  <p class="muted" style="font-size:13px;margin:0 0 12px">Changing a price only affects new sales. Old sales keep the price they were sold at.</p>
  <div class="actions"><button class="btn primary big wide" data-action="save-prod">Save</button></div>`);
}
function priceChange(p,newPrice){
  const old=num(p.price);if(old===newPrice)return {};
  return {price:newPrice,priceHistory:[...(p.priceHistory||[]),{price:old,until:today()}]};
}
function saveProd(){
  const rec={name:val("p-name").trim(),group:val("p-group"),price:num(val("p-price")),active:document.getElementById("p-active").checked};
  if(!rec.name)return toast("Please add a name");
  if(sheet.id){const p=S.data.products.find(x=>x.id===sheet.id);Object.assign(rec,priceChange(p,rec.price));store.update("products",sheet.id,rec).catch(fail);}
  else{rec.sort=1000+S.data.products.length;store.add("products",rec).catch(fail);}
  closeSheet();toast("Price list updated ✓");
}
function savePrices(){
  let n=0;
  document.querySelectorAll("input.pe").forEach(el=>{const p=S.data.products.find(x=>x.id===el.dataset.id);if(!p||el.value==="")return;const ch=priceChange(p,num(el.value));if(ch.priceHistory){n++;store.update("products",p.id,ch).catch(fail);}});
  if(!n)return toast("No prices were changed");
  S.more="products";render();window.scrollTo(0,0);toast(n+" price"+(n===1?"":"s")+" updated ✓");
}

/* ---- csv ---- */
function csv(rows){return rows.map(r=>r.map(v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\r\n");}
function download(name,text){const b=new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);}
function exportCSV(c){
  const d=today();
  if(c==="sales"){const r=[["Date","Customer","Product","Qty","Price","Line total","Order total","Paid","Owed","Delivery date","Delivered","Notes","Added by"]];
    [...S.data.sales].sort(dateDesc).forEach(s=>(s.items||[]).forEach((i,k)=>r.push([s.date,s.customer,i.product,i.qty,i.price,num(i.qty)*num(i.price),k?"":saleTotal(s),k?"":num(s.paid),k?"":saleOwed(s),s.deliveryDate,s.delivered?"yes":"no",k?"":s.notes,nameOf(s.createdBy)])));
    download(`oatbite-sales-${d}.csv`,csv(r));}
  if(c==="expenses"){const r=[["Date","Item","Qty / details","Category","Amount","Paid from","Notes","Added by"]];
    [...S.data.expenses].sort(dateDesc).forEach(e=>(e.items||[]).forEach((i,k)=>r.push([e.date,i.item,i.details||"",i.category,i.amount,e.paidFrom,k?"":e.notes,nameOf(e.createdBy)])));
    download(`oatbite-expenses-${d}.csv`,csv(r));}
  if(c==="money"){const r=[["Date","Type","Amount","Notes"]];[...S.data.money].sort(dateDesc).forEach(m=>r.push([m.date,MONEY_TYPES[m.type]?.label||m.type,m.amount,m.notes]));download(`oatbite-money-${d}.csv`,csv(r));}
}

/* ================================================================
   EVENTS
   ================================================================ */
const A={
  tab:a=>{S.tab=a.dataset.tab;S.more=null;render();window.scrollTo(0,0);},
  month:a=>{S.month=shiftMonth(S.month,+a.dataset.n);render();},
  more:a=>{S.more=a.dataset.v||null;render();window.scrollTo(0,0);},
  close:()=>closeSheet(),
  "new-sale":()=>openSale(null),
  "edit-sale":a=>{const s=S.data.sales.find(x=>x.id===a.dataset.id);if(s)openSale(s);},
  "add-line":()=>{syncSale();sheet.items.push({product:"",qty:1,price:""});redrawSheet(saleSheetHTML());},
  "rm-line":a=>{syncSale();sheet.items.splice(+a.dataset.i,1);redrawSheet(saleSheetHTML());},
  "save-sale":saveSale,
  "del-sale":()=>{if(confirm("Delete this sale? This can't be undone.")){store.remove("sales",sheet.id).catch(fail);closeSheet();toast("Sale deleted");}},
  "new-exp":()=>openExp(null),
  "edit-exp":a=>{const e=S.data.expenses.find(x=>x.id===a.dataset.id);if(e)openExp(e);},
  "add-eline":()=>{syncExp();sheet.items.push({item:"",category:"Ingredients",amount:"",details:"",_other:false});redrawSheet(expSheetHTML());},
  "rm-eline":a=>{syncExp();sheet.items.splice(+a.dataset.i,1);redrawSheet(expSheetHTML());},
  "save-exp":saveExp,
  "del-exp":()=>{if(confirm("Delete this expense? This can't be undone.")){store.remove("expenses",sheet.id).catch(fail);closeSheet();toast("Expense deleted");}},
  "new-money":()=>openMoney(null),
  "edit-money":a=>{const m=S.data.money.find(x=>x.id===a.dataset.id);if(m)openMoney(m);},
  "save-money":saveMoney,
  "del-money":()=>{if(confirm("Delete this entry?")){store.remove("money",sheet.id).catch(fail);closeSheet();}},
  "new-cust":()=>openCust(null),
  "edit-cust":a=>openCust(a.dataset.name),
  "save-cust":saveCust,
  "del-cust":()=>{if(confirm("Remove from the customer list? Their past sales stay.")){store.remove("customers",sheet.id).catch(fail);closeSheet();}},
  "new-prod":()=>openProd(null),
  "edit-prod":a=>openProd(S.data.products.find(x=>x.id===a.dataset.id)),
  "save-prod":saveProd,
  csv:a=>exportCSV(a.dataset.c),
  "import-nb":()=>{if(!confirm("Put back the original notebook records? Edits made to them will be undone."))return;loadNotebook();toast("Notebook records restored ✓");},
  "clear-demo":()=>{if(confirm("Reset the demo on this device? It goes back to just the notebook records.")){S.seed={};store.clearAll();toast("Demo reset");}},
  "save-prices":savePrices,
  "edit-xitem":a=>openXItem(S.data.expenseItems.find(x=>x.id===a.dataset.id)),
  "new-xitem":()=>openXItem(null),
  "save-xitem":saveXItem,
  signout:()=>{if(confirm("Sign out?"))store.authM.signOut(store.auth);},
  "reset-pass":async()=>{const e=document.getElementById("l-email").value.trim();const err=document.getElementById("l-err");
    if(!e){err.textContent="Type your email above first, then tap Forgot password.";return;}
    try{await store.authM.sendPasswordResetEmail(store.auth,e);err.style.color="var(--ok)";err.textContent="Password reset email sent. Check your inbox.";}catch(x){err.textContent="Could not send reset email ("+x.code+").";}}
};
document.addEventListener("click",e=>{const a=e.target.closest("[data-action]");if(!a)return;const f=A[a.dataset.action];if(f){e.preventDefault();f(a,e);}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[role=button][data-action]")){e.preventDefault();e.target.click();}});
document.addEventListener("input",e=>{
  if(sheet?.kind==="sale"&&e.target.matches(".ln-qty,.ln-price,#s-paid,.ln-name")){syncSale();refreshSaleTotals();}
  if(sheet?.kind==="exp"&&e.target.matches(".ex-amt")){syncExp();document.getElementById("e-total").textContent=money(sheet.items.reduce((a,i)=>a+num(i.amount),0));}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(sheet?.kind==="sale"&&t.matches(".ln-prod")){syncSale();const it=sheet.items[t.dataset.i];
    if(t.value==="__other"){it._other=true;it.product="";}
    else{it._other=false;it.product=t.value;const p=S.data.products.find(x=>x.name===t.value);if(p)it.price=p.price;}
    redrawSheet(saleSheetHTML());}
  if(sheet?.kind==="sale"&&t.name==="paymode"){syncSale();sheet.payMode=t.value;redrawSheet(saleSheetHTML());}
  if(sheet?.kind==="exp"&&t.matches(".ex-sel")){syncExp();const it=sheet.items[t.dataset.i];
    if(t.value==="__other"){it._other=true;it.item="";it.category="Ingredients";}
    else{it._other=false;it.item=t.value;it.category=S.data.expenseItems.find(x=>x.name===t.value)?.category||"Miscellaneous";}
    redrawSheet(expSheetHTML());}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="loginForm")return;e.preventDefault();
  const err=document.getElementById("l-err");err.style.color="";err.textContent="Signing in…";
  try{await store.authM.signInWithEmailAndPassword(store.auth,val("l-email").trim(),val("l-pass"));}
  catch(x){err.textContent=["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"].includes(x.code)?"Wrong email or password.":x.code==="auth/network-request-failed"?"No internet connection.":"Could not sign in ("+x.code+").";}
});

boot();
</script>
